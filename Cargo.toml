[package]
name = "extension"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]
members = ["crates/core", "crates/server"]
default-members = ["."]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "sync", "time"] }

[dependencies]
zed_extension_api = "0.7"

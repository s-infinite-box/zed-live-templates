version = 1

# Copy and customize these examples; the extension does not enable them automatically.
[formats]
date = "%Y/%-m/%-d"
time = "%H:%M"
timezone = "local"

# Custom Chinese weekday variable, using the same time snapshot as date and time.
[variables.week]
command = ["bash", "variables/week_zh.sh"]

# Override the built-in host variable with the first segment of the hostname.
[variables.host]
command = ["bash", "variables/short_host.sh"]

# Optional context example; only executed when a template uses $symbol_name$.
[variables.symbol_name]
command = ["python3", "variables/symbol_name.py"]

[[templates]]
id = "daily_note"
trigger = "dt"
description = "Insert a dated note"
languages = ["Markdown"]
body = '''# 周$week$ $date$ $time$ $host$
$END$
---'''

[[templates]]
id = "task"
trigger = "todo"
description = "Insert a task"
languages = ["Markdown"]
body = '- [ ] $END$'
